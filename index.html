<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nandi Epic 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap">
<style>
/* Layout: a dark data-story. Modular infographic panels on a 12-col grid,
   full-bleed photography only as interstitial breathing room. Mobile-first. */
:root{
  --bg:#05060C; --panel:#0B0E18; --panel2:#10131F; --line:#1F2437;
  --fg:#ECEFF7; --mute:#7C8399; --dim:#545B73;
  --acid:#FFB01C; --amber:#FF5A1F; --cyan:#3B5BF0; --pink:#FF2D78; --violet:#8A5CF6;
  --gold:#FFB01C; --red:#FF4040;
  --disp:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-inline:20px}
@media(min-width:900px){.wrap{padding-inline:40px}}

h1,h2,h3{margin:0;font-family:var(--disp);font-weight:800;line-height:1.02;
  letter-spacing:-.02em;text-wrap:balance;font-variation-settings:"wdth" 112}
h1{font-size:clamp(2.6rem,10vw,6rem);text-transform:uppercase}
h2{font-size:clamp(1.9rem,6.2vw,3.4rem);text-transform:uppercase}
h3{font-size:clamp(1.1rem,3vw,1.4rem);letter-spacing:-.01em}
.eyebrow{font-size:clamp(1rem,2.2vw,1.25rem);font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--acid);margin:0 0 1.1rem;line-height:1.25}
.eyebrow.m{color:var(--mute)}
.lede{font-size:clamp(1.1rem,2.1vw,1.35rem);line-height:1.45;color:var(--fg);
  max-width:38ch;margin:1.1rem 0 0;font-weight:500}
.src{font-size:.74rem;line-height:1.45;color:var(--dim);margin:.6rem 0 0;letter-spacing:.02em}
.num{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums;
  font-variation-settings:"wdth" 118;line-height:.9;letter-spacing:-.03em}

section{padding-block:clamp(3.2rem,9vw,6.5rem);position:relative}
.sec-tight{padding-block:clamp(2.2rem,6vw,4rem)}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* ---------- sticky nav ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;
  background:rgba(7,9,10,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .inner{display:flex;align-items:center;gap:1rem;height:54px;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none}
.topbar .inner::-webkit-scrollbar{display:none}
.topbar .brand{font-family:var(--disp);font-weight:800;font-size:.9rem;letter-spacing:.02em;
  text-transform:uppercase;white-space:nowrap;flex:none;font-variation-settings:"wdth" 118}
.navchips{display:flex;gap:.4rem;flex:1}
.chip{background:none;border:1px solid var(--line);color:var(--mute);font:inherit;
  font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:.38rem .7rem;white-space:nowrap;cursor:pointer;border-radius:100px;
  transition:color .18s,border-color .18s,background .18s}
.chip:hover{color:var(--fg);border-color:var(--dim)}
.chip[aria-current="true"]{background:var(--acid);border-color:var(--acid);color:#0A0C06}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--acid);width:0}

/* ---------- hero ---------- */
.hero{position:relative;min-height:88vh;display:flex;align-items:flex-end;overflow:hidden}
.herologo{position:absolute;z-index:4;top:clamp(1.1rem,3.6vw,2rem);left:20px;
  width:clamp(104px,15vw,168px);height:auto;filter:drop-shadow(0 2px 14px rgba(0,0,0,.6))}
@media(min-width:900px){.herologo{left:40px}}
.nandimark{position:absolute;z-index:4;top:clamp(.6rem,2.4vw,1.3rem);right:20px;
  width:clamp(118px,19vw,210px);height:auto;filter:drop-shadow(0 4px 22px rgba(0,0,0,.65))}
@media(min-width:900px){.nandimark{right:40px}}
.hero .bg,.band .bg{position:absolute;inset:0;z-index:0}
.hero .bg img,.band .bg img{width:100%;height:100%;object-fit:cover}
.hero::after,.band::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(7,9,10,.97) 4%,rgba(7,9,10,.70) 38%,rgba(7,9,10,.18) 100%)}
.hero .wrap,.band .wrap{position:relative;z-index:2;width:100%;
  padding-block:clamp(2.4rem,7vw,4.5rem)}
.slot{display:inline-block;background:var(--acid);color:#0A0C06;padding:0 .18em .04em}
.herostats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:2rem;
  border-top:1px solid rgba(255,255,255,.16);padding-top:1.4rem}
.herostats .v{font-family:var(--disp);font-weight:800;font-size:clamp(1.3rem,4.6vw,2.3rem);
  line-height:1;font-variation-settings:"wdth" 118}
.herostats .k{font-size:.7rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--mute);margin-top:.45rem;line-height:1.3}

/* ---------- photo band ---------- */
.band{position:relative;min-height:62vh;display:flex;align-items:flex-end;overflow:hidden}

/* ---------- panels ---------- */
.grid{display:grid;gap:clamp(.8rem,1.6vw,1.1rem);grid-template-columns:repeat(2,1fr)}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);padding:clamp(1.2rem,2.6vw,1.8rem);
  display:flex;flex-direction:column;min-width:0}
.panel.span2{grid-column:span 2}
.panel.span3{grid-column:span 2}
.panel.span4{grid-column:span 2}
@media(min-width:820px){
  .panel.span3{grid-column:span 3}
  .panel.span4{grid-column:span 4}
}
.panel .k{font-size:clamp(.84rem,1.7vw,.98rem);font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);line-height:1.35}
.panel .big{font-size:clamp(2rem,7vw,3.4rem);margin-top:.5rem}
.panel .big.sm{font-size:clamp(1.5rem,5vw,2.4rem)}
.panel .big.xl{font-size:clamp(2.2rem,5.4vw,3.5rem);letter-spacing:-.035em;
  font-variation-settings:"wdth" 100;white-space:nowrap;min-width:0}
.num .unit{font-size:.52em;margin-left:.06em;letter-spacing:0}

/* ---------- quote logo chips ---------- */
.qlogo{background:#fff;display:inline-block;padding:9px 12px;line-height:0;margin-bottom:1.1rem}
.qlogo img{height:clamp(42px,6vw,58px);width:auto}
.qlogo.sm img{height:clamp(34px,4.6vw,44px)}
.qlogo.rb{margin-bottom:1rem;padding:10px 14px}
.qlogo.rb img{height:clamp(44px,6.5vw,62px)}
.qlogo.rb.tiny{margin:0;padding:7px 10px}
.qlogo.rb.tiny img{height:clamp(26px,4vw,34px)}
.sold-right{display:flex;align-items:center;gap:.9rem}

/* ---------- past partner wall ---------- */
.pwall{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:clamp(1.4rem,3vw,2rem)}
.pchip{flex:1 1 128px;min-width:0;background:#fff;display:flex;align-items:center;
  justify-content:center;padding:clamp(.9rem,2.2vw,1.4rem);aspect-ratio:3/2}
.pchip img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.pchip.txt{background:#fff}
.pchip.txt span{font-family:var(--disp);font-weight:800;font-size:clamp(.85rem,1.9vw,1.02rem);
  line-height:1.15;color:#0B0E18;text-align:center;letter-spacing:-.01em}
.bbchmark{width:clamp(150px,22vw,230px);height:auto;margin-bottom:1.2rem}

/* ---------- golden slot section ---------- */
.goldsec{background:
  radial-gradient(1100px 520px at 50% 0%,rgba(244,169,43,.16),transparent 70%),var(--bg)}
.eyebrow.gold{color:var(--gold)}
.goldline{background:linear-gradient(100deg,var(--gold),#FFD98A 45%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}

.titlecard{position:relative;margin-top:1.8rem;padding:clamp(1.6rem,4vw,2.6rem);
  border:1px solid var(--gold);
  background:linear-gradient(155deg,rgba(244,169,43,.14),rgba(244,169,43,.03) 55%,transparent),var(--panel);
  box-shadow:0 0 0 1px rgba(244,169,43,.18),0 24px 60px -30px rgba(244,169,43,.55)}
.tcbadge{position:absolute;top:0;right:0;background:var(--gold);color:#120B02;
  font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:.4rem .8rem}
.tctop{display:flex;flex-wrap:wrap;gap:1.2rem 2rem;align-items:flex-end;justify-content:space-between;
  padding-bottom:1.3rem;border-bottom:1px solid rgba(244,169,43,.3)}
.tclabel{font-size:clamp(1rem,2.2vw,1.25rem);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.tcname{font-family:var(--disp);font-weight:800;text-transform:uppercase;line-height:1.02;
  font-size:clamp(1.6rem,5.4vw,3rem);margin-top:.5rem;letter-spacing:-.02em;
  font-variation-settings:"wdth" 112;max-width:16ch}
.tcprice{font-family:var(--disp);font-weight:800;color:var(--gold);line-height:.9;
  font-size:clamp(2.4rem,9vw,4.6rem);font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  text-align:right;white-space:nowrap}
.tcprice span{display:block;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);margin-top:.5rem;font-family:var(--body);font-weight:700}
.tclist{list-style:none;margin:1.4rem 0 0;padding:0;display:grid;grid-template-columns:1fr;gap:.6rem}
@media(min-width:680px){.tclist{grid-template-columns:1fr 1fr;gap:.6rem 2rem}}
.tclist li{font-size:1.02rem;line-height:1.4;padding-left:1.7rem;position:relative}
.tclist li::before{content:"";position:absolute;left:0;top:.32em;width:1.05em;height:1.05em;background:var(--gold);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 12.6 9.4 18 20 6.4' fill='none' stroke='black' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 12.6 9.4 18 20 6.4' fill='none' stroke='black' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat}

/* ---------- placements: grid on desktop, carousel on a phone ---------- */
.places{margin-top:clamp(1.6rem,3.5vw,2.4rem)}
.carhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.8rem}
.carlbl{font-size:clamp(.95rem,2vw,1.15rem);font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}
.carbtn{position:absolute;z-index:3;top:min(37.5%, calc((880px * 0.75) / 2));transform:translateY(-50%);
  width:clamp(40px,7vw,52px);height:clamp(40px,7vw,52px);border-radius:50%;
  background:rgba(7,9,10,.74);border:1px solid rgba(255,255,255,.26);color:#fff;
  font-size:clamp(1.5rem,3.4vw,2rem);line-height:0;cursor:pointer;display:flex;
  align-items:center;justify-content:center;padding:0 0 .12em 0;
  backdrop-filter:blur(6px);transition:background .2s,border-color .2s,color .2s}
.carbtn.prev{left:clamp(8px,1.6vw,16px)}
.carbtn.next{right:clamp(8px,1.6vw,16px)}
.carbtn:hover{background:var(--gold);border-color:var(--gold);color:#120B02}
.carcount{font-family:var(--disp);font-weight:800;font-size:.95rem;color:var(--gold);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.carcount .cd{display:none}
.carstage{position:relative}
.cartrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;
  scrollbar-width:none;-ms-overflow-style:none;border:1px solid var(--line)}
.cartrack::-webkit-scrollbar{display:none}
.carslide{flex:0 0 100%;scroll-snap-align:start;margin:0;position:relative;background:var(--panel)}
.carslide img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#07090A;display:block}
.carmark{position:absolute;top:clamp(.7rem,2vw,1.2rem);left:clamp(.7rem,2vw,1.2rem);
  background:rgba(244,169,43,.94);color:#120B02;font-size:.72rem;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;padding:.4rem .7rem}
.carslide figcaption{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.2rem}
.carslide figcaption strong{font-size:1.05rem}
.carslide figcaption span{font-size:.88rem;color:var(--mute)}
.cardots{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:1rem}
.cardot{width:9px;height:9px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0}
.cardot.on{background:var(--gold);width:20px;border-radius:100px}
@media(min-width:760px){
  .places .carbtn,.places .cardots{display:none}
  .places .carcount .cm{display:none}
  .places .carcount .cd{display:inline}
  .places .cartrack{display:grid;grid-template-columns:repeat(2,1fr);
    gap:clamp(.6rem,1.2vw,1rem);background:none;border:0;
    overflow:visible;scroll-snap-type:none}
  .places .carslide{flex:none;scroll-snap-align:none;border:1px solid var(--line)}
  .places .carslide figcaption{padding:.85rem .95rem 1.05rem}
  .places .carslide figcaption strong{font-size:.98rem}
  .places .carslide figcaption span{font-size:.82rem}
}
@media(min-width:1000px){.places .cartrack{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.places .cartrack{grid-template-columns:repeat(4,1fr)}}

/* ---------- remaining tiers ---------- */
.restgrid{display:grid;grid-template-columns:1fr;gap:.7rem;margin-top:clamp(1.8rem,4vw,2.6rem)}
@media(min-width:620px){.restgrid{grid-template-columns:1fr 1fr}}
.resttab{display:flex;flex-direction:column;gap:.3rem;text-align:left;background:var(--panel);
  border:1px solid var(--line);color:var(--mute);font:inherit;padding:1.2rem;cursor:pointer;
  transition:border-color .2s,background .2s}
.resttab[aria-pressed="true"]{border-color:var(--gold);background:#19130A}
.resttab .rn{font-family:var(--disp);font-weight:800;font-size:1.1rem;text-transform:uppercase;color:var(--fg)}
.resttab .rp{font-family:var(--disp);font-weight:800;font-size:clamp(1.5rem,4vw,2rem);color:var(--gold)}
.resttab .rs{font-size:.78rem;color:var(--dim)}
.restbody{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);
  padding:clamp(1.3rem,3.2vw,2rem);margin-top:.8rem}
.soldstrip{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;
  margin-top:.8rem;padding:1rem 1.2rem;border:1px dashed var(--line);color:var(--dim)}
.soldstrip .sn{font-weight:700;font-size:.95rem}
.soldstrip .sv{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.8rem;color:var(--red)}

/* ---------- growth chart ---------- */
.gchart{margin-top:1.8rem;background:var(--panel);border:1px solid var(--line);
  padding:clamp(1.2rem,3vw,2rem)}
.gcols{display:flex;align-items:flex-end;gap:clamp(1rem,4vw,2.6rem);
  height:clamp(190px,34vw,260px)}
.gcol{flex:0 1 110px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.gval{font-family:var(--disp);font-weight:800;font-size:clamp(.95rem,2.6vw,1.25rem);
  color:var(--fg);margin-bottom:.5rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.gbarwrap{flex:1;display:flex;align-items:flex-end}
.gbar{width:100%;height:0;background:linear-gradient(to top,var(--cyan),var(--acid));
  transition:height 1.2s cubic-bezier(.22,1,.36,1)}
.gyear{font-size:.8rem;font-weight:700;letter-spacing:.14em;color:var(--mute);
  margin-top:.6rem;text-align:center}
.gjump{align-self:center;padding-bottom:clamp(1.4rem,4vw,2.4rem)}
.gjumpv{font-family:var(--disp);font-weight:800;color:var(--acid);
  font-size:clamp(2.4rem,9vw,4.4rem);line-height:.9;letter-spacing:-.03em}
.gjumpl{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);margin-top:.4rem}
.ac{color:var(--acid)} .am{color:var(--amber)} .cy{color:var(--cyan)}
.pk{color:var(--pink)} .vi{color:var(--violet)} .gd{color:var(--gold)}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:1.15rem;margin-top:1.4rem}
.bar .top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  font-size:.9rem;font-weight:700;margin-bottom:.45rem}
.bar .top .lbl{color:var(--fg);min-width:0}
.bar .top .val{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums;
  white-space:nowrap;font-variation-settings:"wdth" 115}
.bar .track{height:12px;background:var(--panel2);overflow:hidden}
.bar .fill{height:100%;width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.bar .note{font-size:.76rem;color:var(--dim);margin-top:.4rem}

/* ---------- pyramid ---------- */
.pyr{margin-top:1.6rem;display:flex;flex-direction:column;gap:clamp(1rem,2.4vw,1.5rem)}
.pyr .row{display:grid;grid-template-columns:1fr;gap:.55rem;align-items:center}
@media(min-width:760px){.pyr .row{grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:1.6rem}}
.pyr .track{width:100%;min-width:0;background:var(--panel2);height:clamp(30px,6.4vw,44px)}
.pyr .shape{height:100%;width:0;min-width:4px;
  transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.pyr .meta{min-width:0}
.pyr .meta .v{font-family:var(--disp);font-weight:800;font-size:clamp(1.15rem,3.6vw,1.7rem);
  line-height:1.05;font-variation-settings:"wdth" 115;font-variant-numeric:tabular-nums}
.pyr .meta .l{font-size:.82rem;color:var(--mute);line-height:1.35;margin-top:.2rem}

/* ---------- elevation ---------- */
.profilebox{margin-top:1.4rem;background:var(--panel);border:1px solid var(--line);
  padding:clamp(1rem,2.4vw,1.5rem)}
.profilebox svg{width:100%;height:auto;display:block}
.pathline{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.8s ease-out}
.segs{display:flex;gap:.45rem;margin-bottom:1.1rem;flex-wrap:wrap}
.seg{background:none;border:1px solid var(--line);color:var(--mute);font:inherit;
  font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.5rem .9rem;cursor:pointer;transition:all .18s}
.seg[aria-pressed="true"]{background:var(--acid);border-color:var(--acid);color:#0A0C06}

/* ---------- tier selector ---------- */
.tierhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.8rem;
  padding-bottom:1rem;border-bottom:1px solid rgba(198,242,78,.25)}
.tierhead h3{font-size:clamp(1.3rem,3.6vw,1.9rem);text-transform:uppercase}
.tierprice{font-family:var(--disp);font-weight:800;font-size:clamp(1.5rem,4.4vw,2.2rem);color:var(--gold)}
.restbody ul{list-style:none;margin:1.2rem 0 0;padding:0;display:grid;grid-template-columns:1fr;gap:.6rem}
@media(min-width:700px){.restbody ul{grid-template-columns:1fr 1fr;gap:.6rem 1.8rem}}
.restbody li{font-size:1rem;padding-left:1.7rem;position:relative;color:var(--fg);line-height:1.4}
.restbody li::before{content:"";position:absolute;left:0;top:.3em;width:1.05em;height:1.05em;
  background:var(--acid);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 12.6 9.4 18 20 6.4' fill='none' stroke='black' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 12.6 9.4 18 20 6.4' fill='none' stroke='black' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat}
.restbody li.no{color:var(--dim)}
